<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反詐騙檢測助手</title>
  <style>
    :root {
      --bg: #f3f6f4;
      --panel: #ffffff;
      --ink: #1f2a24;
      --muted: #5d6b63;
      --accent: #0f6b4c;
      --accent-hover: #0b553c;
      --border: #d7e0db;
      --danger-bg: #fff4f2;
      --result-bg: #f7faf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #d9efe4 0%, transparent 40%),
        radial-gradient(circle at bottom right, #e7eef2 0%, transparent 45%),
        var(--bg);
    }

    main {
      width: min(720px, 92vw);
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.6;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(31, 42, 36, 0.06);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
      line-height: 1.6;
      color: var(--ink);
      background: #fcfefd;
    }

    textarea:focus {
      outline: 2px solid rgba(15, 107, 76, 0.35);
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #checkBtn {
      background: var(--accent);
      color: white;
    }

    #checkBtn:hover {
      background: var(--accent-hover);
    }

    #checkBtn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #clearBtn {
      background: #eef3f0;
      color: var(--ink);
    }

    .result-title {
      margin: 28px 0 10px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    #resultBox {
      min-height: 140px;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--result-bg);
      line-height: 1.7;
      color: var(--ink);
    }

    #resultBox.is-loading {
      color: var(--muted);
    }

    #resultBox.is-error {
      background: var(--danger-bg);
      border-color: #efc4bc;
    }

    .hint {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>反詐騙檢測助手</h1>
    <p class="lead">貼上可疑網址或完整訊息，系統會用 165 黑名單與 AI 幫你評估風險。</p>

    <section class="panel">
      <label for="userText">可疑內容</label>
      <textarea
        id="userText"
        placeholder="例如：請立即點擊 https://example.com 完成驗證，否則帳戶將被停用"
      ></textarea>

      <div class="actions">
        <button id="checkBtn" type="button">開始分析</button>
        <button id="clearBtn" type="button">清空</button>
      </div>

      <p class="result-title">分析結果</p>
      <div id="resultBox">結果會顯示在這裡。</div>
      <p class="hint">提示：文字太短時，建議貼上完整對話或含有網址的內容，結果會比較準。</p>
    </section>
  </main>

  <script>
    // 先用 querySelector 找到頁面上的元素
    const userText = document.querySelector("#userText");
    const checkBtn = document.querySelector("#checkBtn");
    const clearBtn = document.querySelector("#clearBtn");
    const resultBox = document.querySelector("#resultBox");

    // fetch：用 JavaScript 向後端送資料，並等待回應
    // 這裡會把文字送到 /api/check，後端分析完再回傳結果
    async function checkText() {
      const text = userText.value.trim();

      if (!text) {
        resultBox.className = "is-error";
        resultBox.textContent = "請先貼上可疑的文字或網址。";
        return;
      }

      checkBtn.disabled = true;
      resultBox.className = "is-loading";
      resultBox.textContent = "分析中，請稍候...";

      try {
        const response = await fetch("/api/check", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text: text })
        });

        const data = await response.json();
        resultBox.className = "";
        resultBox.textContent = data.result;
      } catch (error) {
        resultBox.className = "is-error";
        resultBox.textContent = "無法連線到伺服器，請確認 Flask 是否正在執行。";
      }

      checkBtn.disabled = false;
    }

    checkBtn.addEventListener("click", checkText);

    clearBtn.addEventListener("click", function () {
      userText.value = "";
      resultBox.className = "";
      resultBox.textContent = "結果會顯示在這裡。";
      userText.focus();
    });
  </script>
</body>
</html>
