      <option value="no">no - 打不開</option>
      <option value="skip">skip - 先跳過</option>

    <select id="is_scam_related_destination">
      <option value="">（尚未選擇）</option>
      <option value="yes">yes</option>
      <option value="no">no</option>
      <option value="unsure">unsure</option>
    </select>

    <label for="human_notes">備註（可空白）</label>

    <label for="reviewer">檢視者</label>
    <input id="reviewer" type="text" placeholder="例如：dingwei">

    <div class="nav">
      <button type="button" id="prevBtn">上一筆</button>
      <button type="button" class="primary" id="nextBtn">存檔並下一筆</button>
    </div>
  </div>

  <div class="footer-actions">
    <button type="button" class="primary" id="exportBtn">匯出已填 CSV</button>
    <button type="button" id="jumpBtn">跳到下一筆未填</button>
  </div>

</div>

const STORAGE_KEY = "fuzzy_manual_review_v1";

function loadAnswers() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  } catch (e) {
    return {};
  }
}

function saveAnswers(answers) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(answers));
}

let index = 0;
let answers = loadAnswers();

const els = {
  bar: document.getElementById("bar"),
  statusText: document.getElementById("statusText"),
  idLabel: document.getElementById("idLabel"),
  title: document.getElementById("title"),
  meta: document.getElementById("meta"),
  openShort: document.getElementById("openShort"),
  openArticle: document.getElementById("openArticle"),
  destination_opened: document.getElementById("destination_opened"),
  destination_type: document.getElementById("destination_type"),
  is_scam_related_destination: document.getElementById("is_scam_related_destination"),
  human_notes: document.getElementById("human_notes"),
  reviewer: document.getElementById("reviewer"),
};

function isFilled(ans) {
  if (!ans) return false;
  return !!(ans.destination_opened || ans.destination_type || ans.is_scam_related_destination);
}

function filledCount() {
  let n = 0;
  for (const item of ITEMS) {
    if (isFilled(answers[String(item.review_id)])) n += 1;
  }
  return n;
}

function updateProgress() {
  const n = filledCount();
  const pct = Math.round((n / ITEMS.length) * 100);
  els.bar.style.width = pct + "%";
  els.statusText.textContent = n + " / " + ITEMS.length + " 已填";
}

function currentId() {
  return String(ITEMS[index].review_id);
}

function collectForm() {
  return {
    destination_opened: els.destination_opened.value,
    destination_type: els.destination_type.value,
    is_scam_related_destination: els.is_scam_related_destination.value,
    human_notes: els.human_notes.value.trim(),
    reviewer: els.reviewer.value.trim(),
    review_status: (
      els.destination_opened.value ||
      els.destination_type.value ||
      els.is_scam_related_destination.value
    ) ? "reviewed" : "pending",
  };
}

function persistCurrent() {
  answers[currentId()] = collectForm();
  saveAnswers(answers);
  updateProgress();
}

function render() {
  const item = ITEMS[index];
  els.idLabel.textContent = "#" + item.review_id + " / " + ITEMS.length;
  els.title.textContent = item.title;
  els.meta.textContent =
    "短網址商：" + item.shortener_host +
    (item.published_at ? " ｜ 發文：" + item.published_at : "");
  els.openShort.href = item.extracted_url;
  els.openArticle.href = item.article_url;

  const ans = answers[String(item.review_id)] || {};
  els.destination_opened.value = ans.destination_opened || "";
  els.destination_type.value = ans.destination_type || "";
  els.is_scam_related_destination.value = ans.is_scam_related_destination || "";
  els.human_notes.value = ans.human_notes || "";
  // keep reviewer sticky across items if empty on this item
  els.reviewer.value = ans.reviewer || els.reviewer.value || "";
  updateProgress();
}

function csvEscape(value) {
  const s = String(value == null ? "" : value);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCsv() {
  persistCurrent();
  const headers = [
    "review_id","shortener_host","title","article_url","published_at",
    "extracted_url","normalized_url","match_reason","review_status",
    "destination_opened","destination_type","is_scam_related_destination",
    "human_notes","reviewer"
  ];
  const lines = [headers.join(",")];
  for (const item of ITEMS) {
    const ans = answers[String(item.review_id)] || {};
    const row = [
      item.review_id,
      item.shortener_host,
      item.title,
      item.article_url,
      item.published_at,
      item.extracted_url,
      item.normalized_url,
      "shortener_or_redirect_domain_host",
      ans.review_status || "pending",
      ans.destination_opened || "",
      ans.destination_type || "",
      ans.is_scam_related_destination || "",
      ans.human_notes || "",
      ans.reviewer || "",
    ].map(csvEscape);
    lines.push(row.join(","));
  }
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "176455_fuzzy_manual_review.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("prevBtn").addEventListener("click", function () {
  persistCurrent();
  index = Math.max(0, index - 1);
  render();
});

document.getElementById("nextBtn").addEventListener("click", function () {
  persistCurrent();
  if (index < ITEMS.length - 1) {
    index += 1;
    render();
  } else {
    alert("已經是最後一筆。可以按「匯出已填 CSV」。");
  }
});

document.getElementById("exportBtn").addEventListener("click", exportCsv);

document.getElementById("jumpBtn").addEventListener("click", function () {
  persistCurrent();
  let found = -1;
  for (let i = 0; i < ITEMS.length; i++) {
    if (!isFilled(answers[String(ITEMS[i].review_id)])) {
      found = i;
      break;
    }
  }
  if (found === -1) {
    alert("都填過了（至少填了一個下拉選單）。可以匯出 CSV。");
    return;
  }
  index = found;
  render();
});

["destination_opened","destination_type","is_scam_related_destination","human_notes","reviewer"].forEach(function (id) {
  els[id].addEventListener("change", persistCurrent);
  els[id].addEventListener("input", persistCurrent);
});

render();
</script>
