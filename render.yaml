# Render Hobby / Free web service。建立時請選 Free（$0）。
# 不要改成付費 instance。免費服務閒置約 15 分鐘會睡著，下次請求約等 1 分鐘。
# 金鑰不要寫進這個檔；sync: false 代表只在 Dashboard 填。
services:
  - type: web
    name: anti-scam-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: FRONTEND_ORIGIN
        value: https://ccf540123.github.io
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: REVIEW_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
