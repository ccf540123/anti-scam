services:
  - type: web
    name: anti-scam-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    disk:
      name: review-answers
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: FRONTEND_ORIGIN
        value: https://ccf540123.github.io
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: REVIEW_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: REVIEW_PTT_ANSWERS_PATH
        value: /var/data/review/ptt_candidates/answers.json
