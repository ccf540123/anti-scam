<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詐騙資料分析</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div id="appView">
    <div class="shell">
      <aside id="sidebar" class="sidebar">
        <strong class="brand">已審查貼文分析</strong>
        <nav id="sideNav" aria-label="分析區塊">
          <button type="button" data-view="counts">數量</button>
          <button type="button" data-view="keywords">關鍵字</button>
          <button type="button" data-view="links">連結</button>
        </nav>
      </aside>
      <div id="navScrim" class="scrim" hidden></div>

      <div class="workspace">
        <header class="top">
          <button id="menuBtn" type="button" class="btn menu-btn" aria-expanded="false">選單</button>
          <div>
            <h1 id="viewTitle">數量</h1>
          </div>
          <div class="top-actions">
            <a class="btn" href="index.html">回到審查</a>
            <button id="reloadBtn" type="button" class="btn">重新讀取</button>
          </div>
        </header>

        <p id="loadError" class="error" hidden></p>
        <p id="loading" class="lead">正在讀取清單與審查答案…</p>

        <div id="dashboard" hidden>
          <div class="content-grid">
            <main>
              <section data-panel="counts">
                <h2>分析了多少篇</h2>
                <p class="caption">圓餅圖是第一階段清單。內容有、內容沒有來自已完成審查的填答，未審查是還沒審完的文章。這三類都不是 Spam 或 Clean。</p>
                <div class="chart-card">
                  <div class="chart-box"><canvas id="countChart"></canvas></div>
                </div>
                <div class="stat-grid" id="countStats"></div>
                <p id="countNote" class="caption"></p>
              </section>

              <section data-panel="keywords" hidden>
                <h2>內容有的文章裡，審查者寫下的關鍵字</h2>
                <p class="caption">只算「內容有」的文章。詞是人寫進審查結果的 keyword，同一篇重複的詞只算一次，不是從全文自動抓出來的。</p>
                <div id="wordCloud" class="cloud"></div>
                <h3>前 20 名（篇）</h3>
                <div class="chart-box tall"><canvas id="keywordBar"></canvas></div>
              </section>

              <section data-panel="links" hidden>
                <h2>內容有的文章裡出現的網域</h2>
                <p id="linkCaption" class="caption"></p>
                <div class="chart-box tall"><canvas id="linkBar"></canvas></div>
                <table class="domain-table">
                  <thead>
                    <tr><th>網域</th><th>篇文章數</th></tr>
                  </thead>
                  <tbody id="linkTable"></tbody>
                </table>
              </section>
            </main>

            <aside id="explorer" class="explorer">
              <h2 id="explorerTitle">文章探索</h2>
              <p id="explorerMeta" class="caption">點圖表或關鍵字，這裡列出對應文章。</p>
              <div id="explorerList"></div>
              <div id="explorerPager" class="pager"></div>
            </aside>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
